paths:
  inbox: videos/inbox
  posted: videos/posted
  failed: videos/failed
  database: data/metadata.db

api_keys:
  anthropic: ${ANTHROPIC_API_KEY}
  openai: ${OPENAI_API_KEY}

# ── YouTube ────────────────────────────────────────────────────────────────────
youtube:
  enabled: true
  # Download from Google Cloud Console → APIs & Services → Credentials.
  client_secrets: client_secrets.json
  # Written on first OAuth login; refreshed automatically by the Google SDK.
  token_file: token.json
  category_id: "22"        # 22 = People & Blogs; 24 = Entertainment; 28 = Science
  privacy_status: public   # public | unlisted | private
  made_for_kids: false

# ── Instagram ──────────────────────────────────────────────────────────────────
instagram:
  enabled: false
  # Long-lived token from Meta for Developers (expires every 60 days).
  access_token: ${IG_ACCESS_TOKEN}
  business_account_id: ${IG_BUSINESS_ACCOUNT_ID}
  # Path to persist the refreshed token between restarts.
  token_file: ig_token.json
  # Set false to disable the automatic 45-day background refresh.
  auto_refresh_token: true
  # Cloudflare R2 (or any S3-compatible) bucket to host the video during IG processing.
  resolver:
    type: r2
    bucket: lucidus-media
    account_id: ${R2_ACCOUNT_ID}
    access_key_id: ${R2_ACCESS_KEY_ID}
    secret_access_key: ${R2_SECRET_ACCESS_KEY}
    presign_ttl_seconds: 1800
    key_prefix: lucidus-temp/
    # Set to your public R2 subdomain (e.g. https://pub-abc123.r2.dev) to skip presigning.
    public_base_url: ""

# ── TikTok ─────────────────────────────────────────────────────────────────────
tiktok:
  enabled: false
  access_token: ${TIKTOK_ACCESS_TOKEN}
  open_id: ${TIKTOK_OPEN_ID}
  # SELF_ONLY works without app review (posts visible only to your account).
  # Switch to PUBLIC_TO_EVERYONE once your app is approved.
  privacy_level: SELF_ONLY

# ── Posting schedule ───────────────────────────────────────────────────────────
posting:
  max_per_platform_per_day: 3
  min_minutes_between_posts: 90
  jitter_minutes: 30
  # Background ingest workers (Whisper + Claude calls run in a thread pool).
  ingest_workers: 2
  # Max times a failed post is retried before being dead-lettered and dropped.
  max_retries: 5

# ── Captions ───────────────────────────────────────────────────────────────────
captions:
  model: claude-sonnet-4-6
  max_hashtags: 8
  style: "engaging, hook-first, no clickbait"
  # Set true to generate a distinct caption for each platform during ingest.
  # Uses 1 Whisper call but N Claude calls (one per enabled platform).
  per_platform: false
  # Per-platform style overrides. Falls back to `style` if not set.
  platform_styles:
    youtube: "hook in first 5 words, professional, max 5 hashtags, add #Shorts"
    instagram: "conversational, use 1-3 emojis, 5-10 hashtags"
    tiktok: "punchy, lowercase OK, trend-aware, 3-5 hashtags, under 100 chars"

# ── Analytics & reposting ──────────────────────────────────────────────────────
analytics:
  # How often to pull fresh view/like counts from each platform.
  pull_interval_hours: 6
  # Videos in the top N percentile by views are candidates for cross-platform repost.
  top_performer_percentile: 80
  # Minimum days since original post before a video is eligible for repost.
  repost_delay_days: 10

# ── Cockpit ────────────────────────────────────────────────────────────────────
dashboard:
  enabled: true
  # Bind to 0.0.0.0 to expose on the network (pair with auth below).
  host: 127.0.0.1
  port: 8765
  event_buffer: 500
  # HTTP Basic Auth — leave empty to disable (safe for localhost).
  # Set when exposing via Tailscale, Cloudflare Tunnel, or reverse proxy.
  auth:
    username: ${COCKPIT_USER}
    password: ${COCKPIT_PASS}
